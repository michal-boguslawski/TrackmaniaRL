[project]
name = "rl-lib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium[box2d]>=1.3.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.2",
    "moviepy>=2.2.1",
    "pyaml>=26.7.0",
    "pytest>=9.1.1",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
]

[project.scripts]
rl-lib = "rl_lib:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
