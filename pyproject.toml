[project]
name = "rl-lib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium[box2d]>=1.3.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.2",
    "moviepy>=2.2.1",
    "nvidia-ml-py>=13.610.43",
    "pydantic>=2.11.0",
    "pyaml>=26.7.0",
    "pyyaml>=6.0.2",
    "pytest>=9.1.1",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.13.0,<2.14.0",
]
gpu = [
    "torch>=2.13.0,<2.14.0",
]

[project.scripts]
rl-lib = "rl_lib:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
