run:
  algorithm: ppo
  name: ppo_carracing
  total_steps: 1000
  seed: 42
  device: cpu
  log_level: DEBUG
  channels_last: true

environment:
  id: CarRacing-v3
  num_envs: 2
  skip: 4
  continuous: true
  normalize_rewards: true
  reward_normalization_gamma: 0.99
  reward_normalization_epsilon: 0.00000001
  vectorization_mode: async
  autoreset_mode: same_step
  record_video: false
  wrappers:
    - name: record_episode_stats
      stats_buffer_length: 100
      stats_key: episode
    - name: grayscale
      keep_dim: true
    - name: reward_on_done
      on_terminated: null
      on_truncated: 0.0
      on_win: 100.0
    # - name: off_track_penalty
    #   penalty_weight: 0.05
    - name: max_and_skip

network:
  name: PPO
  encoder:
    stack_size: 4

  actor:
    hidden_layers:
      - {
          out_dim: 256,
          activation: relu,
          init_gain: 1.41421356237,
          init_bias: 0.0,
          bias: true,
        }

  critic:
    hidden_layer:
      - {
          out_dim: 256,
          activation: relu,
          init_gain: 1.41421356237,
          init_bias: 0.0,
          bias: true,
        }

trainer:
  name: ppo
