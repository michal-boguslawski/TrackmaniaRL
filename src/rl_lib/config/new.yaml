run:
  total_steps: 1_000_000
  seed: 42
  device: cuda
  log_level: DEBUG
  channels_last: true

environment:
  id: CarRacing-v3
  num_envs: 8
  continuous: true
  normalize_rewards: true
  reward_normalization_gamma: 0.99
  reward_normalization_epsilon: 0.00000001
  vectorization_mode: async
  autoreset_mode: SameStep
  wrappers:
    - name: grayscale
      keep_dim: true
    - name: record_episode_stats
      buffer_length: 100
      stats_key: episode
    - name: max_and_skip
      skip: 2
    - name: off_track_penalty
      penalty_weight: 0.02
    - name: reward_on_done
      on_truncated: 0.0
      on_win: 70.0
    # - name: action_couple

algorithm:
  name: ppo

  network:
    encoder:
      stack_size: 4
    actor:
      concentration_offset: 1.
    critic: {}

  trainer:
    kl:
      target_kl: 0.015

    loss:
      actor_loss_cfg:
        advantage_normalization_strategy: global
        ppo_epsilon: 0.2
        # mean_reg_coef: 0.05

      critic_loss_cfg:
        critic_beta: 0.5

      entropy:
        coefficient: 0.05
        decay: 0.9999
        min_coefficient:  0.001

    optimizer:
      name: Adam
      learning_rates:
        cnn_lr: 3e-5
        sequence_encoder_lr: 3e-5
        actor_lr: 3e-5
        critic_lr: 3e-5

    # scheduler:
    #   name: linear
    #   end_fraction: 0.6

    rollout:
      steps_per_env: 2048

    optimization:
      minibatch_size: 256
      epochs: 6
      minibatch_indexing_mode: iid

tracking:
  console: true
  mlflow: true
  # experiment_name: test
  callbacks:
    - name: episode_statistics
      mode: step

    - name: metrics_logger
      granularity: train_end

    - name: record_video
      interval: 50_000

    - name: evaluation
      interval: 50_000
      episodes: 10
      num_envs: 2
      on_event: env_step

    - name: evaluation
      interval: 1
      episodes: 100
      num_envs: 16
      on_event: rollout_end

    - name: model_checkpoint
      interval: 50_000
