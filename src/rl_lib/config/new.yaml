run:
  total_steps: 1_000_000
  seed: 42
  device: cuda
  log_level: DEBUG
  channels_last: true

environment:
  id: CarRacing-v3
  num_envs: 8
  continuous: true
  normalize_rewards: true
  reward_normalization_gamma: 0.99
  reward_normalization_epsilon: 0.00000001
  vectorization_mode: async
  autoreset_mode: SameStep
  wrappers:
    - name: grayscale
      keep_dim: true
    - name: record_episode_stats
      buffer_length: 100
      stats_key: episode
    - name: max_and_skip
      skip: 2
    - name: off_track_penalty
      penalty_weight: 0.05
    - name: reward_on_done
      on_terminated: null
      on_truncated: 0.0
      on_win: 70.0
    - name: action_couple

algorithm:
  name: ppo

  network:
    # name: ppo
    encoder:
      stack_size: 4
    actor: {}
    critic: {}

  trainer:
    loss:
      actor_loss_cfg:
        advantage_normalization_strategy: global
        ppo_epsilon: 0.1

      critic_loss_cfg:
        critic_beta: 0.8

      entropy:
        coefficient: 0.05
        decay: 0.9998
        min_coefficient:  0.01

    optimizer:
      name: Adam
      learning_rates:
        cnn_lr: 3e-5
        sequence_encoder_lr: 3e-5
        actor_lr: 3e-5
        critic_lr: 1e-4

    scheduler:
      name: linear
      end_fraction: 0.6

    rollout:
      steps_per_env: 1024

    optimization:
      minibatch_size: 256
      epochs: 3
      minibatch_indexing_mode: iid

tracking:
  console: true
  mlflow: true
  # experiment_name: test
  callbacks:
    - name: episode_statistics
      mode: step
    - name: metrics_logger
      granularity: train_end
    - name: record_video
      interval: 100_000
    - name: evaluation
      interval: 100_000
      episodes: 10
      num_envs: 1
      on_event: env_step
    - name: evaluation
      interval: 1
      episodes: 1_000
      num_envs: 8
      on_event: rollout_end
