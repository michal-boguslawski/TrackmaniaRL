run:
  algorithm: ppo
  name: ppo_carracing
  total_steps: 1000
  seed: 42
  device: cpu
  log_level: DEBUG
  channels_last: true

environment:
  id: CarRacing-v3
  num_envs: 2
  continuous: true
  normalize_rewards: true
  reward_normalization_gamma: 0.99
  reward_normalization_epsilon: 0.00000001
  vectorization_mode: async
  autoreset_mode: SameStep
  wrappers:
    - name: record_episode_stats
      buffer_length: 100
      stats_key: episode
    - name: grayscale
      keep_dim: true
    - name: reward_on_done
      on_terminated: null
      on_truncated: 0.0
      on_win: 100.0
    # - name: off_track_penalty
    #   penalty_weight: 0.05
    - name: max_and_skip
      skip: 2

algorithm:
  name: ppo

  network:
    # name: ppo
    encoder:
      stack_size: 4
    actor: {}
    critic: {}

  trainer:
    loss:
      actor_loss_cfg:
        advantage_normalization_strategy: global
        ppo_epsilon: 0.2

      critic_loss_cfg:
        critic_beta: 0.5

      entropy:
        coefficient: 0.001

    optimizer:
      name: Adam
      backbone_lr: 1e-4
      cnn_lr: 1e-4

    rollout:
      steps_per_env: 32

    optimization:
      minibatch_size: 16
      epochs: 3
      minibatch_indexing_mode: iid
